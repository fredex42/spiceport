name: Release

# Push a tag like v0.1.0 to build and publish the release artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu keeps the glibc requirement low.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, appimage: x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, appimage: aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config file \
            libasound2-dev libdbus-1-dev libegl-dev libgl-dev libpulse-dev libudev-dev \
            libwayland-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev \
            libxkbcommon-dev libxrandr-dev libxss-dev libxtst-dev wayland-protocols
          curl -sSfL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage }}.AppImage"
          chmod +x appimagetool
          ./appimagetool --appimage-extract > /dev/null
          echo "APPIMAGETOOL=$PWD/squashfs-root/AppRun" >> "$GITHUB_ENV"

      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
          echo "MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build and package
        run: cargo xtask dist --target ${{ matrix.target }}

      - name: Notarise (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          cd target/dist
          name=$(ls -d spiceport-*-${{ matrix.target }}-app)
          zip=${name%-app}.app.zip
          xcrun notarytool submit "$zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$name/spiceport.app"
          rm "$zip"
          ditto -c -k --keepParent "$name/spiceport.app" "$zip"

      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          d=$(ls -d target/dist/spiceport-*-${{ matrix.target }} | head -1)
          "$d"/spiceport* --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.zip
            target/dist/*.AppImage
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
