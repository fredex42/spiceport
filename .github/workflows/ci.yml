name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Reference sources: the build never reads them, but the Linux
          # golden tests compile spice-common's encoders from them.
          submodules: ${{ runner.os == 'Linux' && 'recursive' || 'false' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install SDL build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config \
            libasound2-dev libdbus-1-dev libegl-dev libgl-dev libpulse-dev libudev-dev \
            libwayland-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev \
            libxkbcommon-dev libxrandr-dev libxss-dev libxtst-dev wayland-protocols \
            libglib2.0-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
        env:
          SPICEPORT_REQUIRE_ORACLE: ${{ runner.os == 'Linux' && '1' || '' }}
      - name: Smoke test
        run: cargo run -p spiceport -- --help

  h264:
    name: h264 feature (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install SDL and FFmpeg build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config \
            libasound2-dev libdbus-1-dev libegl-dev libgl-dev libpulse-dev libudev-dev \
            libwayland-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev \
            libxkbcommon-dev libxrandr-dev libxss-dev libxtst-dev wayland-protocols \
            libavcodec-dev libavformat-dev libavutil-dev libclang-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features spiceport/h264 -- -D warnings
      - name: Test
        run: cargo test -p spice-decode -p spice-client -p spiceport --features spiceport/h264

  windows-gnu:
    name: cross-check x86_64-pc-windows-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake mingw-w64
      - run: cargo check -p spiceport --target x86_64-pc-windows-gnu

  fuzz-smoke:
    name: fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Run each target briefly
        working-directory: fuzz
        run: |
          for t in quic lz glz lz4 jpeg bitmap server_messages; do
            cargo fuzz run "$t" -- -max_total_time=30
          done

  integration:
    name: integration (QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-modules-spice
      - name: Connect headless and capture a frame
        run: |
          scripts/test-server.sh --port 5900 > qemu.log 2>&1 &
          sleep 5
          cargo run -q -p spice-client --example screenshot -- spice://127.0.0.1:5900 shot.ppm 8
          test "$(head -c 2 shot.ppm)" = P6
          # Something other than black must have been drawn (SeaBIOS text).
          test "$(tail -c +16 shot.ppm | tr -d '\000' | wc -c)" -gt 0
      - if: failure()
        run: cat qemu.log
